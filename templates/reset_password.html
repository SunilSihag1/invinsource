<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invinsource – Reset Password</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/reset_password.css" />
</head>

<body>

    <div class="page">
        <div class="card">

            <div class="brand">Invinsource</div>

            <h1>Reset Password</h1>
            <p class="subtitle">Create a new secure password</p>

            <form id="resetForm" method="POST">
                <input type="password" name="password" id="password" placeholder="New Password" required />
                <input type="password" name="confirm_password" id="confirm" placeholder="Confirm New Password" required />

                <div class="strength">
                    <div class="bar">
                        <span id="strengthBar"></span>
                    </div>
                    <span id="strengthText">Weak</span>
                </div>

                <button type="submit" class="btn-primary">
                    Reset Password
                </button>
            </form>

            <p class="success" id="successMsg">
                Password successfully reset!
            </p>

        </div>
    </div>

    <script>
        const password = document.getElementById("password");
        const confirm = document.getElementById("confirm");
        const strengthBar = document.getElementById("strengthBar");
        const strengthText = document.getElementById("strengthText");
        const form = document.getElementById("resetForm");
        const successMsg = document.getElementById("successMsg");

        password.addEventListener("input", updateStrength);

        function updateStrength() {
            const val = password.value;
            let strength = 0;

            if (val.length >= 6) strength++;
            if (/[A-Z]/.test(val)) strength++;
            if (/[0-9]/.test(val)) strength++;
            if (/[^A-Za-z0-9]/.test(val)) strength++;

            if (strength <= 1) {
                strengthBar.style.width = "25%";
                strengthBar.style.background = "#ef4444";
                strengthText.textContent = "Weak";
            } else if (strength === 2 || strength === 3) {
                strengthBar.style.width = "60%";
                strengthBar.style.background = "#22c55e";
                strengthText.textContent = "Medium";
            } else {
                strengthBar.style.width = "100%";
                strengthBar.style.background = "#16a34a";
                strengthText.textContent = "Strong";
            }
        }

        form.addEventListener("submit", (e) => {
            e.preventDefault();

            if (password.value !== confirm.value) {
                alert("Passwords do not match");
                return;
            }

            successMsg.style.display = "block";
            form.reset();
            strengthBar.style.width = "0%";
            strengthText.textContent = "Weak";
        });

    </script>
</body>

</html>
