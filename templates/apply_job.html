<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Apply for Job</title>
    <link rel="stylesheet" href="/static/apply_job.css">
    <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
    <script src="/static//animations/apply_job.js"></script>
</head>

<body>

    {% include 'partials/header.html' %}

    <div class="apply-wrapper">


        <div class="apply-card">
            <!-- RIGHT FORM -->
            <div class="apply-form">
                <h2>Apply for {{job.title}}</h2>
                <p class="subtext">Submit your application for {{ job.title }} position</p>

                <form method="post" enctype="multipart/form-data">

                    <label>Full Name *</label>
                    <input type="text" name="name" placeholder="Your full name" value="{{ user_info.name }}" required>

                    <label>Email *</label>
                    <input type="email" name="email" placeholder="your.email@example.com" value="{{ user_info.email }}" required>

                    <label>Phone Number *</label>
                    <input type="text" name="phone_number" placeholder="+91 9876543210" value="{{ user_info.phone_number }}" required>

                    <label>Resume *</label>
                    <div class="file-input">
                        <input type="file" name="resume" value="{{ user_profile.resume_url if user_profile }}" required>
                    </div>

                    <label>Portfolio</label>
                    <input type="text" name="portfolio" placeholder="https://portfolio.com">

                    <label>GitHub</label>
                    <input type="text" name="github" placeholder="https://github.com/username" value="{{ user_profile.github_url if user_profile }}">

                    <label>LinkedIn</label>
                    <input type="text" name="linkedin" placeholder="https://linkedin.com/username" value="{{ user_profile.linkedin_url if user_profile }}">

                    <label>Cover Letter</label>
                    <textarea name="cover_letter"
                        placeholder="Tell us why you're a great fit for this role..."></textarea>

                    <label>Years of Experience</label>
                    <input type="number" name="experience" placeholder="e.g. 3">

                    <label>Expected Salary (Monthly)</label>
                    <input type="text" name="expected_salary" placeholder="₹ Expected Salary">

                    {% with messages = get_flashed_messages(with_categories=true) %}
                    {% for category, message in messages %}
                    <script>
                        showSnackbar("{{ message }}", "{{ category }}");
                    </script>
                    {% endfor %}
                    {% endwith %}


                    <div class="btn-row">
                        <button type="submit" class="btn-primary">
                            Submit Application
                        </button>
                        <a href="/job" class="btn-secondary">
                            Back to Jobs
                        </a>
                    </div>

                </form>
            </div>

        </div>
    </div>

    {% include 'partials/footer.html' %}

</body>

</html>
